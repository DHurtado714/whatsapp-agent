name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-darwin-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-binaries.ts bun-darwin-arm64
      - name: Smoke test
        run: dist/bin/whatsapp-agent-darwin-arm64 --version
      - name: e2e against the compiled binary
        run: WA_TEST_BIN=dist/bin/whatsapp-agent-darwin-arm64 bun run test:e2e
      - name: Package
        run: |
          cd dist/bin
          tar -czf whatsapp-agent-darwin-arm64.tar.gz whatsapp-agent-darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-darwin-arm64
          path: dist/bin/whatsapp-agent-darwin-arm64.tar.gz
      - name: Build the no-terminal macOS app bundle
        run: bun run scripts/build-macos-app.ts --arch=arm64
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-app-darwin-arm64
          path: dist/app/*.zip

  build-darwin-x64:
    # macos-13 (the last Intel runner image) has been getting retired/starved
    # of capacity — jobs sit "queued" forever with no runner assigned. Ad-hoc
    # codesign doesn't need the host to match the target arch (it just runs
    # `codesign` on macOS, same reasoning the build-linux job below already
    # relies on to cross-compile arm64 from an x64 host), so build the x64
    # binary on the same arm64 runner as the arm64 job instead.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # The arm64 runner can't execute an x64 Mach-O at all without this —
      # codesigning doesn't need it, but actually running the binary for the
      # smoke test and e2e step below does.
      - name: Install Rosetta 2
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-binaries.ts bun-darwin-x64
      - name: Smoke test
        run: dist/bin/whatsapp-agent-darwin-x64 --version
      - name: e2e against the compiled binary
        run: WA_TEST_BIN=dist/bin/whatsapp-agent-darwin-x64 bun run test:e2e
      - name: Package
        run: |
          cd dist/bin
          tar -czf whatsapp-agent-darwin-x64.tar.gz whatsapp-agent-darwin-x64
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-darwin-x64
          path: dist/bin/whatsapp-agent-darwin-x64.tar.gz
      - name: Build the no-terminal macOS app bundle
        run: bun run scripts/build-macos-app.ts --arch=x64
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-app-darwin-x64
          path: dist/app/*.zip

  build-linux:
    # All three Linux variants cross-compile fine from one x64 runner — only
    # macOS artifacts need to be built natively (for codesigning).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run scripts/build-binaries.ts bun-linux-x64 bun-linux-x64-baseline bun-linux-arm64
      - name: Smoke test (native x64 target)
        run: dist/bin/whatsapp-agent-linux-x64 --version
      - name: e2e against the compiled binary (native x64 target)
        run: WA_TEST_BIN=dist/bin/whatsapp-agent-linux-x64 bun run test:e2e
      - name: Package
        run: |
          cd dist/bin
          for f in whatsapp-agent-linux-x64 whatsapp-agent-linux-x64-baseline whatsapp-agent-linux-arm64; do
            tar -czf "$f.tar.gz" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: whatsapp-agent-linux
          path: dist/bin/*.tar.gz

  release:
    needs: [build-darwin-arm64, build-darwin-x64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: |
          ls -la
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file .github/RELEASE_NOTES_HEADER.md \
            artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS
